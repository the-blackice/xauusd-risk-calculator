<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>XAUUSD Risk Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#f8fafc;font-family:Inter,Arial,sans-serif;min-height:100vh;padding:18px}
.app{max-width:520px;margin:auto}
.card{background:#111a2b;border:1px solid #26334a;border-radius:22px;padding:20px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
h1{font-size:25px;margin:0 0 6px}
.sub{color:#94a3b8;font-size:14px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;color:#cbd5e1;font-size:13px;margin:0 0 7px}
input,select{width:100%;padding:13px;border-radius:11px;border:1px solid #334155;background:#0b1220;color:#fff;font-size:16px;outline:none}
input:focus,select:focus{border-color:#facc15}
.full{grid-column:1/-1}
button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#facc15;color:#111827;font-size:17px;font-weight:800;cursor:pointer}
.results{margin-top:18px;display:grid;gap:9px}
.row{display:flex;justify-content:space-between;gap:15px;background:#0b1220;border-radius:11px;padding:12px}
.row span:first-child{color:#94a3b8}.row span:last-child{font-weight:700;text-align:right}
.good{color:#4ade80!important}.warn{color:#fb7185!important}
.note{font-size:12px;color:#94a3b8;line-height:1.5;margin-top:15px}
.badge{display:inline-block;font-size:11px;padding:5px 8px;border-radius:99px;background:#1e293b;color:#cbd5e1;margin-bottom:12px}
@media(max-width:430px){body{padding:12px}.card{padding:16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="card">
<div class="badge">XAUUSD • Risk Management</div>
<h1>Gold Risk Calculator</h1>
<div class="sub">Calculate position size before placing a trade.</div>

<div class="grid">
<div>
<label>Account Balance ($)</label>
<input id="balance" type="number" value="20" min="0" step="0.01">
</div>
<div>
<label>Risk (%)</label>
<input id="risk" type="number" value="1" min="0" step="0.1">
</div>
<div>
<label>Entry Price</label>
<input id="entry" type="number" step="0.01" placeholder="e.g. 3750">
</div>
<div>
<label>Stop Loss</label>
<input id="sl" type="number" step="0.01" placeholder="e.g. 3740">
</div>
<div>
<label>Take Profit</label>
<input id="tp" type="number" step="0.01" placeholder="e.g. 3770">
</div>
<div>
<label>Contract Size</label>
<input id="contract" type="number" value="100" min="1" step="1">
</div>
<div class="full">
<label>Direction</label>
<select id="direction"><option value="buy">BUY</option><option value="sell">SELL</option></select>
</div>
</div>

<button onclick="calculate()">Calculate Trade</button>
<div id="results" class="results"></div>
<div class="note">Educational risk calculator. Verify the exact contract specifications, spread, commission, leverage and margin requirements shown by your broker before trading real money.</div>
</div>
</div>

<script>
function money(n){return "$"+n.toFixed(2)}
function calculate(){
 const balance=+document.getElementById("balance").value;
 const riskPct=+document.getElementById("risk").value;
 const entry=+document.getElementById("entry").value;
 const sl=+document.getElementById("sl").value;
 const tp=+document.getElementById("tp").value;
 const contract=+document.getElementById("contract").value;
 const dir=document.getElementById("direction").value;
 const out=document.getElementById("results");

 if(!balance||riskPct<=0||!entry||!sl||!tp||contract<=0){
   out.innerHTML='<div class="row"><span>Status</span><span class="warn">Enter all values</span></div>'; return;
 }
 const validSL=dir==="buy"?sl<entry:sl>entry;
 const validTP=dir==="buy"?tp>entry:tp<entry;
 if(!validSL||!validTP){
   out.innerHTML='<div class="row"><span>Status</span><span class="warn">Check BUY/SELL levels</span></div>'; return;
 }
 const riskMoney=balance*riskPct/100;
 const slDistance=Math.abs(entry-sl);
 const tpDistance=Math.abs(tp-entry);
 const lot=riskMoney/(slDistance*contract);
 const profit=lot*tpDistance*contract;
 const rr=profit/riskMoney;
 const balanceAfterLoss=balance-riskMoney;
 const balanceAfterProfit=balance+profit;
 const riskClass=riskPct<=2?'good':'warn';
 const rrClass=rr>=2?'good':'warn';

 out.innerHTML=`
 <div class="row"><span>Risk Amount</span><span>${money(riskMoney)}</span></div>
 <div class="row"><span>Stop Distance</span><span>${slDistance.toFixed(2)}</span></div>
 <div class="row"><span>Recommended Lot</span><span>${lot.toFixed(3)}</span></div>
 <div class="row"><span>Potential Loss</span><span class="${riskClass}">-${money(riskMoney)}</span></div>
 <div class="row"><span>Potential Profit</span><span class="good">+${money(profit)}</span></div>
 <div class="row"><span>Risk : Reward</span><span class="${rrClass}">1 : ${rr.toFixed(2)}</span></div>
 <div class="row"><span>Balance if SL hits</span><span>${money(balanceAfterLoss)}</span></div>
 <div class="row"><span>Balance if TP hits</span><span>${money(balanceAfterProfit)}</span></div>
 <div class="row"><span>Risk Check</span><span class="${riskPct<=2?'good':'warn'}">${riskPct<=2?'Within 2% limit':'Above 2% — high risk'}</span></div>
 <div class="row"><span>R:R Check</span><span class="${rr>=2?'good':'warn'}">${rr>=2?'Meets 1:2 target':'Below 1:2 target'}</span></div>`;
}
calculate();
</script>
</body>
</html>
